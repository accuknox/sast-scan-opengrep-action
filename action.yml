name: "Accuknox SAST: Opengrep"
description: "Run AccuKnox SAST scan on the repository; results are automatically uploaded to CSPM panel."

branding:
  icon: "shield"
  color: "purple"

inputs:
  soft_fail:
    description: "Do not fail the pipeline if scan finds issues"
    required: false
    default: "true"
  pipeline_id:
    description: "Pipeline/Job ID to correlate with CI/CD runs"
    required: false
    default: ${{ github.run_id }}
  job_url:
    description: "URL for the current GitHub job"
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  accuknox_endpoint:
    description: "CSPM panel endpoint URL"
    required: true
  accuknox_token:
    description: "Token for authenticating with CSPM panel"
    required: true
  accuknox_label:
    description: "Label in AccuKnox SaaS for scan results"
    required: true
  severity:
    description: "Comma-separated severities: MEDIUM, HIGH, CRITICAL"
    required: false
    default: "HIGH"
  accuknox_ai_analysis:
    description: "Enable AI analysis (CodeAssure). When true, provider, model, and an API key are required."
    required: false
    default: "false"
  anthropic_api_key:
    description: "Anthropic API key, exported as ANTHROPIC_API_KEY (an existing ANTHROPIC_API_KEY env is kept when this is empty). Used for AI SAST only when codeassure_provider is anthropic and codeassure_api_key and CODEASSURE_API_KEY are both empty."
    required: false
    default: ""
  codeassure_provider:
    description: "Required when AI SAST is on. One of openai, openai-compatible, anthropic, google, gemini. Env CODEASSURE_PROVIDER is used when this is empty. Use anthropic for Anthropic's API. Use openai or openai-compatible for OpenRouter."
    required: false
    default: ""
  codeassure_model:
    description: "Required when AI SAST is on. Model name, for example claude-sonnet-4-6. For OpenRouter use its model id, for example anthropic/claude-sonnet-4.6. Env CODEASSURE_MODEL is used when this is empty."
    required: false
    default: ""
  codeassure_api_base:
    description: "Optional API host. Leave empty for Anthropic so CodeAssure calls https://api.anthropic.com. Set https://openrouter.ai/api/v1 for OpenRouter, or any other non-default endpoint (Azure OpenAI, a company proxy). Env CODEASSURE_API_BASE is used when this is empty."
    required: false
    default: ""
  codeassure_api_key:
    description: "Required when AI SAST is on, unless CODEASSURE_API_KEY is set (or anthropic_api_key with provider anthropic). Exported as CODEASSURE_API_KEY. For OpenRouter this is the OpenRouter key, not the Anthropic key."
    required: false
    default: ""
  scanner_version:
    description: "aspm-scanner-cli GitHub release tag"
    required: false
    default: "v0.15.1"

runs:
  using: "composite"
  steps:
    - name: Run AccuKnox SAST Scan
      shell: bash
      env:
        SOFT_FAIL: ${{ inputs.soft_fail }}
        PIPELINE_ID: ${{ inputs.pipeline_id }}
        JOB_URL: ${{ inputs.job_url }}
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        SEVERITY: ${{ inputs.severity }}
        ACCUKNOX_AI_ANALYSIS: ${{ inputs.accuknox_ai_analysis }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        INPUT_CODEASSURE_PROVIDER: ${{ inputs.codeassure_provider }}
        INPUT_CODEASSURE_MODEL: ${{ inputs.codeassure_model }}
        INPUT_CODEASSURE_API_BASE: ${{ inputs.codeassure_api_base }}
        INPUT_CODEASSURE_API_KEY: ${{ inputs.codeassure_api_key }}
        SCANNER_VERSION: ${{ inputs.scanner_version }}
      run: |
        set -euo pipefail

        trim() { local v="${1//[$'\t\r\n ']}"; echo "$v"; }
        is_true() { [ "$(trim "$1" | tr '[:upper:]' '[:lower:]')" = "true" ]; }

        if [ -z "$ACCUKNOX_ENDPOINT" ] || [ -z "$ACCUKNOX_TOKEN" ] || [ -z "$ACCUKNOX_LABEL" ]; then
          echo "::error::accuknox_endpoint, accuknox_token, and accuknox_label must be set."
          exit 1
        fi

        SCANNER_VERSION="$(trim "$SCANNER_VERSION")"
        SCANNER_VERSION="${SCANNER_VERSION:-v0.15.1}"
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64|Linux-amd64) ASSET="accuknox-aspm-scanner-linux-amd64" ;;
          Darwin-arm64)             ASSET="accuknox-aspm-scanner-darwin-arm64" ;;
          *)
            echo "::error::Native OpenGrep action supports Linux x86_64 and macOS arm64. Got $(uname -s) $(uname -m)."
            exit 1
            ;;
        esac

        # Keep the binary outside the workspace so it is not scanned or left in the repo.
        TOOL_DIR="${RUNNER_TEMP:-/tmp}/accuknox"
        SCANNER="$TOOL_DIR/accuknox-aspm-scanner"
        mkdir -p "$TOOL_DIR"

        echo "Downloading AccuKnox ASPM Scanner ${SCANNER_VERSION} (${ASSET})..."
        curl -fsSL --retry 3 --retry-delay 5 \
          "https://github.com/accuknox/aspm-scanner-cli/releases/download/${SCANNER_VERSION}/${ASSET}" \
          -o "$SCANNER"
        chmod +x "$SCANNER"

        echo "Installing local OpenGrep binary and rules (no container image)..."
        "$SCANNER" tool install --type sast

        EXTRA_ARGS=()

        SEVERITY="$(trim "$SEVERITY")"
        if [ -n "$SEVERITY" ]; then
          EXTRA_ARGS+=(--severity "$SEVERITY")
        fi

        if is_true "$ACCUKNOX_AI_ANALYSIS"; then
          PROVIDER="${INPUT_CODEASSURE_PROVIDER:-${CODEASSURE_PROVIDER:-}}"
          MODEL="${INPUT_CODEASSURE_MODEL:-${CODEASSURE_MODEL:-}}"
          API_BASE="${INPUT_CODEASSURE_API_BASE:-${CODEASSURE_API_BASE:-}}"
          if [ -z "$PROVIDER" ] || [ -z "$MODEL" ]; then
            echo "::error::AI SAST requires codeassure_provider and codeassure_model (or CODEASSURE_PROVIDER and CODEASSURE_MODEL)."
            exit 1
          fi

          if [ -n "$INPUT_ANTHROPIC_API_KEY" ]; then
            export ANTHROPIC_API_KEY="$INPUT_ANTHROPIC_API_KEY"
          fi
          if [ -n "$INPUT_CODEASSURE_API_KEY" ]; then
            export CODEASSURE_API_KEY="$INPUT_CODEASSURE_API_KEY"
          fi
          if [ -n "${CODEASSURE_API_KEY:-}" ]; then
            KEY_VAR="CODEASSURE_API_KEY"
          elif [ "$PROVIDER" = "anthropic" ] && [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            KEY_VAR="ANTHROPIC_API_KEY"
          else
            if [ "$PROVIDER" = "anthropic" ]; then
              echo "::error::AI SAST requires codeassure_api_key, CODEASSURE_API_KEY, or anthropic_api_key."
            else
              echo "::error::AI SAST with provider '${PROVIDER}' requires codeassure_api_key (or CODEASSURE_API_KEY). anthropic_api_key is only used with provider anthropic."
            fi
            exit 1
          fi

          echo "Installing local CodeAssure binary for AI SAST..."
          "$SCANNER" tool install --type codeassure

          # api_key holds "$VAR" so the secret itself is never written to disk.
          CONFIG_PATH="$TOOL_DIR/codeassure.json"
          PROVIDER="$PROVIDER" MODEL="$MODEL" API_BASE="$API_BASE" KEY_VAR="$KEY_VAR" CONFIG_PATH="$CONFIG_PATH" \
            python3 -c '
        import json, os
        model = {"provider": os.environ["PROVIDER"], "name": os.environ["MODEL"], "api_key": "$" + os.environ["KEY_VAR"]}
        if os.environ.get("API_BASE"):
            model["api_base"] = os.environ["API_BASE"]
        with open(os.environ["CONFIG_PATH"], "w", encoding="utf-8") as f:
            json.dump({"model": model}, f)
        '
          echo "CodeAssure config: provider=${PROVIDER} model=${MODEL}"
          EXTRA_ARGS+=(--codeassure-config "$CONFIG_PATH" --ai-analysis)
        fi

        SCAN_ARGS=(--keep-results)
        if is_true "$SOFT_FAIL"; then
          SCAN_ARGS+=(--softfail)
        fi

        echo "Running AccuKnox SAST scan with native OpenGrep..."
        "$SCANNER" scan "${SCAN_ARGS[@]}" sast \
          --command "scan ." \
          --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
          --commit-sha "${GITHUB_SHA}" \
          --pipeline-id "$PIPELINE_ID" \
          --job-url "$JOB_URL" \
          ${EXTRA_ARGS[@]+"${EXTRA_ARGS[@]}"}
