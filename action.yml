name: "Accuknox SAST: Opengrep"
description: "Run AccuKnox SAST scan on the repository; results are automatically uploaded to CSPM panel."

branding:
  icon: "shield"
  color: "purple"

inputs:
  soft_fail:
    description: "Do not fail the pipeline if scan finds issues"
    required: false
    default: "true"
  pipeline_id:
    description: "Pipeline/Job ID to correlate with CI/CD runs"
    required: false
    default: ${{ github.run_id }}
  job_url:
    description: "URL for the current GitHub job"
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  accuknox_endpoint:
    description: "CSPM panel endpoint URL"
    required: true
  accuknox_token:
    description: "Token for authenticating with CSPM panel"
    required: true
  accuknox_label:
    description: "Label in AccuKnox SaaS for scan results"
    required: true
  severity:
    description: "Comma-separated severities: MEDIUM, HIGH, CRITICAL"
    required: false
    default: "HIGH"
  accuknox_ai_analysis:
    description: "Enable AI analysis (CodeAssure). Requires a model key in the environment."
    required: false
    default: "false"
  anthropic_api_key:
    description: "Optional Anthropic API key (exported as ANTHROPIC_API_KEY for CodeAssure)"
    required: false
    default: ""
  scanner_version:
    description: "aspm-scanner-cli GitHub release tag"
    required: false
    default: "v0.15.1"

runs:
  using: "composite"
  steps:
    - name: Run AccuKnox SAST Scan
      shell: bash
      env:
        SOFT_FAIL: ${{ inputs.soft_fail }}
        PIPELINE_ID: ${{ inputs.pipeline_id }}
        JOB_URL: ${{ inputs.job_url }}
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        SEVERITY: ${{ inputs.severity }}
        ACCUKNOX_AI_ANALYSIS: ${{ inputs.accuknox_ai_analysis }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        SCANNER_VERSION: ${{ inputs.scanner_version }}
      run: |
        set -euo pipefail

        if [ -z "$ACCUKNOX_ENDPOINT" ] || [ -z "$ACCUKNOX_TOKEN" ] || [ -z "$ACCUKNOX_LABEL" ]; then
          echo "ERROR: ACCUKNOX_ENDPOINT, ACCUKNOX_TOKEN, and ACCUKNOX_LABEL must be set!"
          exit 1
        fi

        SCANNER_VERSION="${SCANNER_VERSION//[$'\t\r\n ']}"
        if [ -z "$SCANNER_VERSION" ]; then
          SCANNER_VERSION="v0.15.1"
        fi
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64|Linux-amd64)
            ASSET="accuknox-aspm-scanner-linux-amd64"
            ;;
          Darwin-arm64)
            ASSET="accuknox-aspm-scanner-darwin-arm64"
            ;;
          *)
            echo "ERROR: Native OpenGrep action supports Linux x86_64 and macOS arm64. Got $(uname -s) $(uname -m)."
            exit 1
            ;;
        esac

        echo "Downloading AccuKnox ASPM Scanner ${SCANNER_VERSION} (${ASSET})..."
        curl -fL "https://github.com/accuknox/aspm-scanner-cli/releases/download/${SCANNER_VERSION}/${ASSET}" \
          -o accuknox-aspm-scanner
        chmod +x accuknox-aspm-scanner

        echo "Installing local OpenGrep binary and rules (no container image)..."
        ./accuknox-aspm-scanner tool install --type sast

        SOFT_FAIL_ARG=""
        SOFT_FAIL="${SOFT_FAIL//[$'\t\r\n ']}"
        if [ "$SOFT_FAIL" = "true" ]; then
          SOFT_FAIL_ARG="--softfail"
        fi

        SEVERITY_ARG=""
        SEVERITY="${SEVERITY//[$'\t\r\n ']}"
        if [ -n "$SEVERITY" ]; then
          SEVERITY_ARG="--severity $SEVERITY"
        fi

        AI_ARGS=""
        ACCUKNOX_AI_ANALYSIS="${ACCUKNOX_AI_ANALYSIS//[$'\t\r\n ']}"
        if [ "$ACCUKNOX_AI_ANALYSIS" = "true" ]; then
          AI_ARGS="--ai-analysis"
        fi

        echo "Running AccuKnox SAST scan with native OpenGrep..."
        ./accuknox-aspm-scanner scan --keep-results $SOFT_FAIL_ARG sast \
          --command "scan ." \
          --repo-url "https://github.com/${GITHUB_REPOSITORY}.git" \
          --commit-sha "${GITHUB_SHA}" \
          --pipeline-id "$PIPELINE_ID" \
          --job-url "$JOB_URL" \
          $SEVERITY_ARG \
          $AI_ARGS
